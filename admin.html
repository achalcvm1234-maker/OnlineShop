<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Catlery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div id="admin-login-wrap" class="admin-login-wrap" style="display:none;">
        <div class="logo" style="justify-content:center; font-family:var(--font-display); font-size:24px; font-weight:700; display:flex; align-items:center; gap:12px; margin-bottom:24px;">
            <span class="logo-icon" style="background:var(--rose); color:#fff; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-family:var(--font-display);">CT</span>
            Catlery Admin
        </div>
        <div class="admin-card">
            <h2 style="text-align: center; margin-bottom: 20px; font-size: 22px;">Admin Login</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="admin-login-email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="admin-login-password" placeholder="••••••••">
            </div>
            <button id="admin-login-btn" class="btn" style="width: 100%; margin-top: 5px;" onclick="handleAdminDirectLogin()">Login to Admin Panel</button>
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: var(--rose); text-decoration: none; font-size: 14px; font-weight: 600;">← Back to Storefront</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (compat) — same version everywhere, deferred -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" defer></script>

    <script src="js/firebase-init.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/admin-login.js" defer></script>
</body>
</html>
